<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developing Treatment Plans: The Basics</title>
<style>
  body {
    margin: 0;
    padding: 12px;
    font-family: Arial, Helvetica, sans-serif;
    background: transparent;
  }
  .player-card {
    background-color: #BDD6E6;
    border: 3px solid #003865;
    border-radius: 8px;
    padding: 16px 20px;
    max-width: 700px;
    box-sizing: border-box;
  }
  .player-title {
    color: #003865;
    font-weight: bold;
    font-size: 16px;
    margin: 0 0 4px 0;
  }
  .player-subtitle {
    color: #003865;
    font-size: 13px;
    margin: 0 0 14px 0;
  }
  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #play-btn {
    background-color: #003865;
    color: #BDD6E6;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    min-width: 44px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #play-btn:hover {
    background-color: #00294d;
  }
  #play-btn:focus-visible {
    outline: 3px solid #003865;
    outline-offset: 2px;
  }
  .scrub-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #seek {
    width: 100%;
    accent-color: #003865;
    cursor: pointer;
  }
  #seek:focus-visible {
    outline: 2px solid #003865;
    outline-offset: 2px;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #003865;
    margin-top: 2px;
  }
  .transcript-link {
    margin: 12px 0 0 0;
    font-size: 13px;
  }
  .transcript-link a {
    color: #003865;
    font-weight: bold;
    text-decoration: underline;
  }
  .transcript-link a:focus-visible {
    outline: 2px solid #003865;
    outline-offset: 2px;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>

<h2 class="visually-hidden">Audio player for the podcast episode Developing Treatment Plans: The Basics, hosted by Dr. Jonathan B. Singer</h2>

<div class="player-card">
  <p class="player-title">Developing Treatment Plans: The Basics</p>
  <p class="player-subtitle">Dr. Jonathan B. Singer, The Social Work Podcast</p>

  <div class="controls-row">
    <button id="play-btn" aria-label="Play">
      <span id="play-icon" aria-hidden="true">&#9658;</span>
    </button>
    <div class="scrub-wrap">
      <input type="range" id="seek" value="0" min="0" max="100" step="1"
             aria-label="Seek through episode">
      <div class="time-row">
        <span id="current-time">0:00</span>
        <span id="duration-time">0:00</span>
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata">
    <source src="https://www.socialworkpodcast.com/TreatmentPlan64.mp3" type="audio/mpeg">
    <source src="http://www.socialworkpodcast.com/TreatmentPlan64.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
    <a href="http://www.socialworkpodcast.com/TreatmentPlan64.mp3">Download the audio file</a> instead.
  </audio>

  <p class="transcript-link"><a href="https://socialworkpodcast.blogspot.com/2007/03/developing-treatment-plans-basics.html" target="_blank" rel="noopener">Read the episode transcript<span class="visually-hidden"> (opens in a new tab)</span></a></p>
</div>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  const seek = document.getElementById('seek');
  const currentTimeEl = document.getElementById('current-time');
  const durationTimeEl = document.getElementById('duration-time');

  function formatTime(seconds) {
    if (!isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  playBtn.addEventListener('click', function () {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', function () {
    playIcon.innerHTML = '&#10074;&#10074;';
    playBtn.setAttribute('aria-label', 'Pause');
  });

  audio.addEventListener('pause', function () {
    playIcon.innerHTML = '&#9658;';
    playBtn.setAttribute('aria-label', 'Play');
  });

  audio.addEventListener('loadedmetadata', function () {
    seek.max = Math.floor(audio.duration);
    durationTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', function () {
    if (!seek.matches(':active')) {
      seek.value = Math.floor(audio.currentTime);
    }
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  seek.addEventListener('input', function () {
    audio.currentTime = seek.value;
  });

  audio.addEventListener('ended', function () {
    playIcon.innerHTML = '&#9658;';
    playBtn.setAttribute('aria-label', 'Play');
  });
</script>

</body>
</html>
